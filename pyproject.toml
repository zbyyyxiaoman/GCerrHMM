[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcerrhmm"
version = "1.0.4"
description = "GC-aware error HMM and reproducibility harness for long-read sequencing simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Boyang Zhang"},
  {name = "Tao Jiang"}
]
keywords = [
  "Oxford Nanopore",
  "long-read sequencing",
  "sequencing simulation",
  "GC content",
  "hidden Markov model",
  "benchmark",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.15",
  "biopython>=1.84",
  "pysam>=0.23",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
docs = [
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pillow>=10",
  "pypdf>=5",
  "pdfplumber>=0.11",
]
test = []

[project.scripts]
gcerrhmm-train = "train_errhmm:main"
gcerrhmm-simulate = "generate_simulated:main"
gcerrhmm-level1 = "evaluate_level1:main"
gcerrhmm-downstream = "downstream_tasks:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "ablation_study",
  "create_truth_variants",
  "downstream_tasks",
  "evaluate_level1",
  "evaluate_sim_fastq",
  "gcbin1_control",
  "generate_simulated",
  "phasing_eval",
  "profile_matched_gcbins",
  "profile_real_data",
  "recompute_level1_error_rate",
  "recompute_qv_wasserstein",
  "sv_eval",
  "sv_spikein",
  "train_errhmm",
  "visualization",
]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
